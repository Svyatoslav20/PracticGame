<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра в пары</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="start">
        <div class="divI">
            <ul class="info">
                <p class="name">Пары</p>
                <p class="steps miniInfo">Шаги:</p>
                <p class="time miniInfo">Время:</p>
            </ul>
        </div>
        <div class="divS">
            <p class="subinfo">Настроить количество карточек (от 2 до 6)</p>
            <input type="number" min="2" max="6" step='2' class="startInp" placeholder="По горизонтали / вертикали">
            <button class="startBtn">НАЧАТЬ</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
